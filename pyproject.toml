[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chemoinformatics-workbench"
version = "0.1.0"
description = "Reproducible molecular-data workflows for validation, standardization, descriptors, similarity analysis and QSAR."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Bassam Nohra" }
]
dependencies = [
    "rdkit>=2026.9,<2027",
    "numpy>=2.5,<3",
    "pandas>=3.1,<4",
]

[project.optional-dependencies]
analysis = [
    "scipy>=1.18,<2",
    "scikit-learn>=1.9,<2",
    "matplotlib>=3.11,<4",
    "seaborn>=0.13,<1",
]
dev = [
    "jupyterlab>=4.6,<5",
    "pytest>=9.2,<10",
]

[tool.setuptools.packages.find]
where = ["src"]